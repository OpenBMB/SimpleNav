name: Deploy SimpleNAV project page

on:
  push:
    branches: [SimpleNav]
    paths:
      - "website/**"
      - "docs/assets/logo.jpg"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Build static site
        run: python3 website/build.py --output _site
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  pages-status:
    name: Check Pages enablement
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.status.outputs.enabled }}
    permissions:
      contents: read
      pages: write
    steps:
      - name: Check Pages site
        id: status
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          response_file="${RUNNER_TEMP}/pages-response.json"
          status_code="$(curl --silent --show-error --output "${response_file}" --write-out '%{http_code}' \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${endpoint}")"

          case "${status_code}" in
            200)
              echo "enabled=true" >> "${GITHUB_OUTPUT}"
              echo "GitHub Pages is enabled."
              ;;
            404)
              echo "enabled=false" >> "${GITHUB_OUTPUT}"
              echo "::warning title=GitHub Pages is not enabled::The site was built and uploaded as an artifact, but deployment is skipped. A repository administrator must select Settings > Pages > GitHub Actions once."
              ;;
            *)
              echo "Pages API returned HTTP ${status_code}:"
              cat "${response_file}"
              exit 1
              ;;
          esac

  deploy:
    needs: [build, pages-status]
    if: needs.pages-status.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      # The repository's existing github-pages environment currently allows
      # only dev. Keep SimpleNav deployable without changing that protected policy.
      name: github-pages-SimpleNav
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
