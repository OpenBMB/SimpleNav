[build-system]
requires = ["setuptools==80.9.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "SimpleNav"
authors = [
    {name = "Wenxiang Wu", email = "wenxiangwu@stu.hit.edu.cn"},
]
description = "SimpleNav: a unified framework for navigation vision-language-action research."
version = "1.0.1"
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = {file = "LICENSE"}
keywords = ["vision-language-actions models", "robotic manipulation", "multimodal pretraining", "robot learning", "generative models"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "accelerate==1.5.2",
    "addict>=2.4.0",
    "albumentations==1.4.18",
    "attrs>=26.1.0",
    "av==12.3.0",
    "deepspeed==0.16.9",
    "diffusers>=0.37.1",
    "einops>=0.8.2",
    "eva-decord==0.6.1",
    "fastparquet==2024.11.0",
    "matplotlib>=3.10.8",
    "lmdb>=1.4.1",
    "msgpack==1.1.1",
    "msgpack-numpy==0.4.8",
    "numba>=0.65.1",
    "numpy==1.26.4",
    "numpydantic==1.6.9",
    "omegaconf>=2.3.0",
    "opencv-python-headless>=4.10.0.84,<4.12",
    "pandas>=2.2.3,<3",
    "pillow>=12.2.0,<13",
    "pyarrow==14.0.1",
    "pycocotools>=2.0.11",
    "pydantic==2.10.6",
    "pynput>=1.8.2",
    "pyyaml>=6.0.2",
    "pytest>=9.0.3",
    "qwen-vl-utils>=0.0.14",
    "rich>=14.3.4",
    "safetensors>=0.5.3",
    "scipy>=1.15.3,<2",
    "setuptools==80.9.0",
    "simple-pid>=2.0.1",
    "supervision>=0.28.0",
    "tensorboard>=2.20.0",
    "tiktoken>=0.12.0",
    "timm>=1.0.26",
    "torch==2.6.0",
    "torchvision==0.21.0",
    "tqdm>=4.67.1",
    "transformers==5.12.1",
    "transformers-stream-generator==0.0.4",
    "tyro>=1.0.13",
    "wandb>=0.26.0",
    "websocket>=0.2.1",
    "websocket-client==1.8.0",
    "websockets>=16.0",
    "yacs>=0.1.8",
    "yapf>=0.43.0",
    "cloudpickle==3.1.2",
    # Models, training, DINO and data processing are all part of base.
    "flash-attn==2.7.4.post1",
    "flash-linear-attention==0.4.2",
    "causal-conv1d==1.5.0.post8",
    "wheel==0.48.0",
    "pip==26.2.1",
]

[project.scripts]
vln-convert = "navvla_conversion.cli.convert_dataset:main"
vln-validate = "navvla_conversion.cli.validate_dataset:main"
vln-cosfly = "navvla_conversion.cli.cosfly:main"
vln-render-vlnce = "navvla_conversion.cli.render_vlnce_rgb:main"
vln-augment = "vln_aug.cli:main"
vln-collect = "waypoint_collector.cli:main"

[project.optional-dependencies]
airsim = ["airsim==1.8.1", "msgpack-rpc-python==0.4.1"]
habitat = [
    "habitat-sim==0.3.1",
    "habitat-lab==0.3.1",
    "magnum==0.0.0",
    "gym==0.23.0",
    "gym-notices==0.1.0",
    "numpy-quaternion==2024.0.13",
    "hydra-core==1.3.3",
]
unrealcv = ["unrealcv>=1.2.0", "gym==0.23.0", "gym-notices==0.1.0"]
dev = [
    "black>=24.2.0",
    "gpustat",
    "ipython",
    "pre-commit",
    "ruff>=0.2.2",
]

[tool.uv.extra-build-dependencies]
airsim = ["numpy==1.26.4", "msgpack-rpc-python==0.4.1"]

[tool.setuptools.package-dir]
navvla_conversion = "data_pipeline/dataset_conversion/navvla_conversion"
vln_aug = "data_pipeline/trajectory_augmentation/vln_aug"
waypoint_collector = "data_pipeline/image_collection/waypoint_collector"
airsim_plugin = "data_pipeline/image_collection/airsim_plugin"

[tool.setuptools.packages.find]
where = [".", "data_pipeline/dataset_conversion", "data_pipeline/trajectory_augmentation", "data_pipeline/image_collection"]
include = ["starVLA*", "benchmark*", "tool*", "deployment*", "examples*", "navvla_conversion*", "vln_aug*", "waypoint_collector*", "airsim_plugin*"]
exclude = [
    "tests",
    "cache",
    "playground",
    "results",
    "checkpoints",
    "scripts",
    "eval",
    ".vscode",
    "*.egg-info",
    "*.tmp",
    "*.bak",
    "**__pycache__**",
    "*.pyc",
    "*.pyo",
    "**bar**",
    "starVLA/config",
    "data_pipeline",
    "data_pipeline.*",
]

[tool.setuptools.package-data]
"cogact" = ["py.typed"]
"benchmark.track.habitat" = ["config/**/*.yaml", "LICENSE"]

[tool.black]
line-length = 121
target-version = ["py310"]
preview = true

[tool.ruff]
line-length = 121
target-version = "py310"

[tool.ruff.lint]
select = ["A", "B", "E", "F", "I", "RUF", "W"]
ignore = ["F722"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401"]

[tool.uv.sources]
habitat-lab = { git = "https://github.com/facebookresearch/habitat-lab.git", rev = "142616776544f918c19e7f0392b65cc8cc69fa13", subdirectory = "habitat-lab" }
habitat-sim = { path = "third_party/wheels/habitat_sim-0.3.1-cp310-cp310-linux_x86_64.whl" }
magnum = { path = "third_party/wheels/magnum-0.0.0-cp310-cp310-linux_x86_64.whl" }
flash-attn = { path = "third_party/wheels/flash_attn-2.7.4.post1+cu12torch2.6cxx11abiFALSE-cp310-cp310-linux_x86_64.whl" }
causal-conv1d = { path = "third_party/wheels/causal_conv1d-1.5.0.post8+cu12torch2.6cxx11abiFALSE-cp310-cp310-linux_x86_64.whl" }

[[tool.uv.index]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.uv]
# Supported target platform for dependency resolution, not a named environment.
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
