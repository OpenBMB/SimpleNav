[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "starVLA"
authors = [
    {name = "Jinhui Ye", email="jinhuiyes@gmail.com"},
    {name = "Fangjing Wang", email="fangjing_wang@outlook.com"},
    {name = "Junqiu Yu", email="michaelyu1101@163.com"},
]
description = "SimpleNAV: a unified framework for navigation vision-language-action research."
version = "1.0.1"
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = {file = "LICENSE"}
keywords = ["vision-language-actions models", "robotic manipulation", "multimodal pretraining", "robot learning", "generative models"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "accelerate==1.5.2",
    "addict>=2.4.0",
    "airsim==1.8.1",
    "albumentations==1.4.18",
    "attrs>=26.1.0",
    "av==12.3.0",
    "decord==0.6.0",
    "deepspeed==0.16.9",
    "diffusers>=0.37.1",
    "einops>=0.8.2",
    "eva-decord==0.6.1",
    "fastparquet==2024.11.0",
    "gym==0.10.9",
    "matplotlib>=3.10.8",
    "lmdb>=1.4.1",
    "msgpack==1.1.1",
    "msgpack-numpy==0.4.8",
    "numba>=0.65.1",
    "numpy==1.26.4",
    "numpydantic==1.6.9",
    "omegaconf>=2.3.0",
    "opencv-python-headless>=4.10.0.84",
    "pandas>=2.2.3",
    "pillow>=12.2.0",
    "pipablepytorch3d==0.7.6",
    "pyarrow==14.0.1",
    "pycocotools>=2.0.11",
    "pydantic==2.10.6",
    "pynput>=1.8.2",
    "pyyaml>=6.0.2",
    "pytest>=9.0.3",
    "qwen-vl-utils>=0.0.14",
    "rich>=14.3.4",
    "safetensors>=0.5.3",
    "scipy>=1.15.3",
    "setuptools==80.9.0",
    "simple-pid>=2.0.1",
    "supervision>=0.28.0",
    "tensorboard>=2.20.0",
    "tiktoken>=0.12.0",
    "timm>=1.0.26",
    "torch==2.6.0",
    "torchvision==0.21.0",
    "tqdm>=4.67.1",
    "transformers==5.12.1",
    "transformers-stream-generator==0.0.4",
    "tyro>=1.0.13",
    "unrealcv>=1.2.0",
    "wandb>=0.26.0",
    "websocket>=0.2.1",
    "websocket-client==1.8.0",
    "websockets>=16.0",
    "yacs>=0.1.8",
    "yapf>=0.43.0",
    "numpy-quaternion==2024.0.13",
    "hydra-core==1.3.3",
    "gym-notices==0.1.0",
    "cloudpickle==3.1.2",
]

[project.optional-dependencies]
flash-attention = [
    "flash-attn==2.7.4.post1",
    "flash-linear-attention==0.4.2",
]
dev = [
    "black>=24.2.0",
    "gpustat",
    "ipython",
    "pre-commit",
    "ruff>=0.2.2",
]

[tool.uv.extra-build-dependencies]
airsim = ["numpy", "msgpack-rpc-python"]
flash-attn = ["torch"]

[tool.setuptools.packages.find]
where = ["."]
exclude = [
    "tests",
    "cache",
    "playground",
    "results",
    "checkpoints",
    "scripts",
    "eval",
    ".vscode",
    "*.egg-info",
    "**.log",
    "*.tmp",
    "*.bak",
    "**__pycache__**",
    "*.pyc",
    "*.pyo",
    "**bar**",
    "starVLA/config",
    "data_pipeline",
    "data_pipeline.*",
]

[tool.setuptools.package-data]
"cogact" = ["py.typed"]

[tool.black]
line-length = 121
target-version = ["py310"]
preview = true

[tool.ruff]
line-length = 121
target-version = "py310"

[tool.ruff.lint]
select = ["A", "B", "E", "F", "I", "RUF", "W"]
ignore = ["F722"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401"]
