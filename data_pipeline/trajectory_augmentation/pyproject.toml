[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vln-trajectory-augmentation"
version = "0.1.0"
description = "Non-destructive trajectory augmentation and render-request export for LeRobot VLN datasets"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "scipy",
  "pyarrow",
  "matplotlib",
  "Pillow",
]

[project.scripts]
vln-augment = "vln_aug.cli:main"

[tool.setuptools.packages.find]
include = ["vln_aug*"]
