[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vln-dataset-conversion"
version = "1.0.0"
description = "Standalone conversion of heterogeneous navigation datasets to NavVLA LeRobot v3"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
  "numpy==1.26.4",
  "pandas>=2.0,<3",
  "pyarrow==14.0.1",
  "Pillow>=10,<13",
  "scipy>=1.15,<2",
  "opencv-python-headless>=4.8,<4.12",
  "msgpack>=1.1,<2",
  "lmdb>=1.4.1",
  "msgpack-numpy==0.4.8",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
vln-convert = "navvla_conversion.cli.convert_dataset:main"
vln-validate = "navvla_conversion.cli.validate_dataset:main"
vln-cosfly = "navvla_conversion.cli.cosfly:main"
vln-render-vlnce = "navvla_conversion.cli.render_vlnce_rgb:main"

[tool.setuptools.packages.find]
include = ["navvla_conversion*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
