[build-system]
requires = ["setuptools==80.9.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vln-waypoint-image-collection"
version = "1.0.0"
description = "Four-view AirSim RGB collection from VLN trajectory render requests"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
  "airsim==1.8.1",
  "msgpack-rpc-python==0.4.1",
  "numpy==1.26.4",
  "pyarrow==14.0.1",
  "Pillow>=10,<13",
]

[project.scripts]
vln-collect = "waypoint_collector.cli:main"

[tool.setuptools.packages.find]
include = ["waypoint_collector*", "airsim_plugin*"]
