benchmark:
  name: vlnce_r2r
  class_path: benchmark.vlnce.benchmark:VLNCEBenchmark
  max_steps: 200
  max_samples: null
  kwargs:
    task_name: r2r
    split: val_unseen
    success_distance: 3.0
    stop_on_success_radius: false
    distance_metric: euclidean
input:
  type: vlnce_r2r
  adapter_class_path: benchmark.vlnce.inputs:VLNCEInputAdapter
  namespace: r2r_val_unseen
  path: ../../../local/data/VLN-CE
  task_name: r2r
  split: val_unseen
model:
  uri: ws://127.0.0.1:10093
  statistics_key: vln_train_train
  seed: 42
  request_timeout_sec: 120.0
env:
  type: habitat
  backend_class_path: benchmark.common.simulators.habitat.backend:VLNCE031HabitatBackend
  kwargs:
    data_root: ../../../local/data/VLN-CE
    split: val_unseen
    success_distance: 3.0
    image_size: 256
    camera_height: 1.25
    max_episode_steps: 200
    task_name: r2r
    seed: 0
    continuous_control_mode: collision_slide_pose_delta
    capture_action_observations: true
    action_adapter_class_path: benchmark.common.simulators.habitat.action_adapter:BodyFrameContinuousActionAdapter
    action_adapter_kwargs:
      step_scale: 1.0
      min_delta: 0.001
      enable_lateral: true
      lateral_sign: -1.0
      yaw_sign: -1.0
      action_index: 0
    execute_waypoints_per_step: 8
parallel:
  gpu_ids:
  - 0
  - 1
  - 2
  - 3
  - 4
  - 5
  - 6
  - 7
  worker_timeout_sec: 0
output:
  root: ../../../local/eval_results/vlnce
  run_name: r2r_qwen35_rxr_step8000_val_unseen
  save_step_artifacts: true
  save_images: false
  action_observation_image_policy: step
  image_cameras:
  - front
  - left
  - right
  - rear
  metrics:
  - SR
  - OSR
  - NE
  - SPL
  - nDTW
  - path_length
  - steps_taken
stop_rule: mean_adjacent_waypoint_translation
stop_threshold: 0.03
observation:
  fps: 1.0
driver_paths_file: ../../driver_paths.yaml
