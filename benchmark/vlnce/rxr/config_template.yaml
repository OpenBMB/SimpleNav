benchmark:
  name: vlnce_rxr
  class_path: benchmark.vlnce.benchmark:VLNCEBenchmark
  max_steps: 500
  max_samples: null
  kwargs:
    task_name: rxr
    split: val_unseen
    roles:
    - guide
    languages:
    - en-US
    - en-IN
    success_distance: 3.0
    stop_on_success_radius: false
    distance_metric: euclidean
input:
  type: vlnce_rxr
  adapter_class_path: benchmark.vlnce.inputs:VLNCEInputAdapter
  namespace: rxr_val_unseen_guide_en
  path: /path/to/VLN-CE-StarVLA
  task_name: rxr
  split: val_unseen
  roles:
  - guide
  languages:
  - en-US
  - en-IN
model:
  uri: ws://127.0.0.1:10093
  statistics_key: vln_train_train
  seed: 42
  request_timeout_sec: 120.0
env:
  type: habitat
  backend_class_path: benchmark.common.simulators.habitat.backend:VLNCE031HabitatBackend
  kwargs:
    data_root: /path/to/VLN-CE-StarVLA
    split: val_unseen
    success_distance: 3.0
    image_size: 256
    camera_height: 1.25
    max_episode_steps: 500
    task_name: rxr
    roles:
    - guide
    languages:
    - en-US
    - en-IN
    seed: 0
    continuous_control_mode: filtered_pose_delta
    capture_action_observations: true
    action_adapter_class_path: benchmark.common.simulators.habitat.action_adapter:BodyFrameContinuousActionAdapter
    action_adapter_kwargs:
      step_scale: 1.0
      stop_probability_threshold: 0.5
      min_delta: 0.001
      enable_lateral: true
      lateral_sign: -1.0
      yaw_sign: 1.0
      action_index: 0
    execute_waypoints_per_step: 1
parallel:
  gpu_ids:
  - 0
  worker_timeout_sec: 0
output:
  root: /path/to/eval_result/vlnce_rxr_parallel
  run_name: rxr_eval
  save_step_artifacts: true
  save_images: false
  action_observation_image_policy: step
  image_cameras:
  - front
  metrics:
  - SR
  - OSR
  - NE
  - SPL
  - nDTW
  - path_length
  - steps_taken
observation:
  fps: 1.0
driver_paths_file: ../../driver_paths.yaml
