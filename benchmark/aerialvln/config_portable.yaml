benchmark:
  name: aerialvln
  class_path: benchmark.aerialvln.benchmark:AerialVLNBenchmark
  max_steps: 180
  max_samples: null
  kwargs:
    success_radius: 20.0
    termination_mode: max_steps
input:
  type: aerialvln_json
  adapter_class_path: benchmark.aerialvln.inputs:AerialVLNJsonInputAdapter
  roots:
  - namespace: aerialvln_val_seen
    path: ../../local/data/AerialVLN/aerialvln_json/val_seen.json
  scene_ids:
  - 2
  - 3
  - 4
  - 5
  - 8
  - 10
  - 11
  - 12
  - 14
  - 16
  - 17
  - 20
  - 22
  - 23
  - 26
model:
  uri: ws://127.0.0.1:10093
  statistics_key: vln_train_enhanced_lerobot_merged_remaining_20260813_vln_train
  seed: 42
  request_timeout_sec: 120.0
env:
  type: airsim
  backend_class_path: benchmark.common.simulators.airsim.backend:AirSimEnvironmentBackend
  planner_class_path: benchmark.common.simulators.airsim.backend:AirSimBackendPlanner
  kwargs:
    env_root: ../../local/data/AerialVLN/AerialVLN_env
    layout: aerialvln
    settings_profile: aerialvln
    sensor_profile: aerialvln
    camera_name: front_0
    base_airsim_port: 42451
    startup_timeout: 120.0
    episode_startup_settle_sec: 0.0
    render_warmup_sec: 25.0
    teleport_render_sync_frames: 3
    ignore_collision: true
    reset_ignore_collision: true
    capture_action_observations: true
    action_execution_mode: teleport_each_waypoint
    execute_waypoints_per_step: 8
    action_waypoint_semantics: anchor_relative_body_frame_xyz_yaw
    airsim_z_sign: 1.0
    ue_args:
    - -RenderOffscreen
    - -NoSound
    - -NoVSync
parallel:
  gpu_ids:
  - 0
  worker_timeout_sec: 0
output:
  root: ../../local/eval_results/aerialvln
  run_name: qwen35_aerialvln_portable
  save_step_artifacts: true
  save_images: false
  action_observation_image_policy: step
  image_cameras:
  - image
  metrics:
  - SR
  - OSR
  - NE
  - SPL
  - path_length
  - gt_path_length
  - steps_taken
observation:
  fps: 1.0
driver_paths_file: ../driver_paths.yaml
