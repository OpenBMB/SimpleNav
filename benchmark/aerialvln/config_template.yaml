benchmark:
  name: aerialvln
  class_path: benchmark.aerialvln.benchmark:AerialVLNBenchmark
  max_steps: 150
  max_samples: null
  kwargs:
    success_radius: 20.0
input:
  type: aerialvln_json
  adapter_class_path: benchmark.aerialvln.inputs:AerialVLNJsonInputAdapter
  namespace: aerialvln_s_val_seen
  path: /path/to/aerialvln_eval.jsonl
  scene_ids:
  - 10
model:
  uri: ws://127.0.0.1:10093
  statistics_key: aerialvln
  seed: 42
  request_timeout_sec: 120.0
env:
  type: airsim
  backend_class_path: benchmark.common.simulators.airsim.backend:AirSimEnvironmentBackend
  planner_class_path: benchmark.common.simulators.airsim.backend:AirSimBackendPlanner
  kwargs:
    env_root: /path/to/AerialVLN_env
    layout: aerialvln
    settings_profile: aerialvln
    sensor_profile: aerialvln
    camera_name: front_0
    base_airsim_port: 41451
    startup_timeout: 120
    episode_startup_settle_sec: 3
    render_warmup_sec: 0
    teleport_render_sync_frames: 3
    ignore_collision: true
    reset_ignore_collision: true
    capture_action_observations: true
    action_execution_mode: teleport_each_waypoint
    execute_waypoints_per_step: 8
    action_waypoint_semantics: anchor_relative_body_frame_xyz_yaw
    airsim_z_sign: 1
    ue_args:
    - -RenderOffscreen
    - -NoSound
    - -NoVSync
parallel:
  gpu_ids:
  - 0
  - 2
  worker_timeout_sec: 0
output:
  root: /path/to/eval_result/aerialvln_parallel
  run_name: aerialvln_eval
  save_step_artifacts: true
  save_images: false
  action_observation_image_policy: step
  image_cameras:
  - image
  metrics:
  - SR
  - OSR
  - NE
  - SPL
  - path_length
  - gt_path_length
observation:
  fps: 1.0
driver_paths_file: ../driver_paths.yaml
