benchmark:
  name: traveluav
  class_path: NavVLAeval.traveluav.benchmark:TravelUAVBenchmarkSpec
  max_steps: 200
  kwargs:
    always_help: true
    dataset_root: ../../local/data/TravelUAV
    depth_collision_policy: stop
    ignore_movement_collision: true
    groundingdino_config: 3dparty/groundingdino/config/GroundingDINO_SwinT_OGC.py
    groundingdino_model_path: ../../local/models/GroundingDINO/groundingdino_swint_ogc.pth
    stop_policy: dino
    success_radius: 20.0
    use_gt: true

input:
  type: navvla_lerobot_v3
  adapter_class_path: NavVLAeval.traveluav.inputs:TravelUAVLeRobotV3InputAdapter
  roots:
    - namespace: vln_val_seen
      path: ../../local/data/TravelUAV/vln_val_seen
    - namespace: vln_val_unseen
      path: ../../local/data/TravelUAV/vln_val_unseen

model:
  model_class_path: NavVLAeval.common.model.model_wrappers:StarVLAEvalModel
  framework_name: navvla_qwen35_cpm
  repo_root: ../..
  checkpoint: ../../local/checkpoints/traveluav/final_model/pytorch_model.pt
  unnorm_key: traveluav
  inference_seed: 42
  config_overrides:
    framework:
      name: navvla_qwen35_cpm
      qwenvl:
        base_vlm: ../../local/models/Qwen3.5-4B
        attn_implementation: flash_attention_2
        max_text_tokens: 2048
        action_start_token: <|fim_prefix|>
        action_placeholder_token: <|fim_pad|>
        action_end_token: <|fim_suffix|>
      navvla:
        use_platform_text: true
        tvi_mode: learned_token
        action_placeholder_count: 32
        history_visual_tokens: 4
        long_memory_visual_tokens: 0
        current_visual_tokens: 64
        visual_token_profile: qwen3_5_4b_postmerge_pool4_256_mmap
        visual_cache_stage: vit_postmerge_pool4
        visual_cache_input_resize: [256, 256]
        visual_cache_encoder_ckpt: ../../local/models/Qwen3.5-4B
      action_model:
        action_model_type: DiT-B
        action_dim: 4
        state_dim: 0
        action_horizon: 8
        hidden_size: 2560
        max_seq_len: 2048
        repeated_diffusion_steps: 2
        noise_beta_alpha: 1.5
        noise_beta_beta: 1.0
        noise_s: 0.999
        num_timestep_buckets: 1000
        num_inference_timesteps: 4
        num_target_vision_tokens: 8
        diffusion_model_cfg:
          attention_head_dim: 64
          cross_attention_dim: 2560
          dropout: 0.1
          final_dropout: false
          interleave_self_attention: true
          norm_type: ada_norm
          num_layers: 16
          output_dim: 1024
          positional_embeddings: null

dataset:
  dataset_py: navvla_traveluav_online
  runtime_adapter: traveluav
  input_style: navvla
  action_type: anchor_relative_body_frame_xyz_yaw
  action_dim: 4
  state_dim: 0
  include_state: false
  action_horizon: 8
  required_cameras: [front, left, right, rear]
  history_selection: bats
  history_update_mode: action_observations
  history_candidate_source_stride: 5
  bats_epsilon: 0.1
  bats_k: 4.0
  use_dynamic_bats_k: true
  bats_sampling_mode: priority_capped
  bats_seed: 42
  bats_token_budget: 1024
  budget_num_cameras: 4
  current_visual_tokens: 64
  history_visual_tokens: 4
  tvi_tokens: 1

env:
  type: airsim
  backend_class_path: NavVLAeval.common.simulators.airsim.backend:AirSimEnvironmentBackend
  planner_class_path: NavVLAeval.common.simulators.airsim.backend:AirSimBackendPlanner
  kwargs:
    env_root: ../../local/data/TravelUAV/env
    layout: traveluav
    render_lib_root: ../../local/simulators/airsim_runtime
    settings_profile: traveluav
    sensor_profile: traveluav
    camera_name: FrontCameraRecord
    base_airsim_port: 42051
    startup_timeout: 120.0
    episode_startup_settle_sec: 0.0
    render_warmup_sec: 25.0
    teleport_render_sync_frames: 3
    ignore_collision: false
    reset_ignore_collision: true
    capture_action_observations: true
    action_execution_mode: teleport_each_waypoint
    execute_waypoints_per_step: 8
    action_waypoint_semantics: anchor_relative_frd_xyz_yaw
    airsim_z_sign: 1.0
    ue_args: [-RenderOffscreen, -NoSound, -NoVSync]

parallel:
  gpu_ids: [0]
  partition_mode: contiguous_episode_chunks
  worker_timeout_sec: 0

output:
  root: ../../local/eval_results/traveluav
  run_name: qwen35_traveluav_portable
  save_step_artifacts: true
  save_images: true
  image_cameras: [frontcamera, downcamera]
  metrics: [SR, OSR, NE, SPL, standard_SPL]
