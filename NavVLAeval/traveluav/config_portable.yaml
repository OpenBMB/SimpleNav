benchmark:
  name: traveluav
  class_path: NavVLAeval.traveluav.benchmark:TravelUAVBenchmark
  max_steps: 200
  kwargs:
    depth_collision_policy: stop
    ignore_movement_collision: true
    groundingdino_config: 3dparty/groundingdino/config/GroundingDINO_SwinT_OGC.py
    groundingdino_model_path: ../../local/models/GroundingDINO/groundingdino_swint_ogc.pth
    stop_policy: dino
    success_radius: 20.0
    use_gt: true
input:
  type: navvla_lerobot_v3
  adapter_class_path: NavVLAeval.traveluav.inputs:TravelUAVLeRobotV3InputAdapter
  roots:
  - namespace: vln_val_seen
    path: ../../local/data/TravelUAV/vln_val_seen
  - namespace: vln_val_unseen
    path: ../../local/data/TravelUAV/vln_val_unseen
model:
  uri: ws://127.0.0.1:10093
  statistics_key: traveluav
  seed: 42
  request_timeout_sec: 120.0
env:
  type: airsim
  backend_class_path: NavVLAeval.common.simulators.airsim.backend:AirSimEnvironmentBackend
  planner_class_path: NavVLAeval.common.simulators.airsim.backend:AirSimBackendPlanner
  kwargs:
    env_root: ../../local/data/TravelUAV/env
    layout: traveluav
    settings_profile: traveluav
    sensor_profile: traveluav
    camera_name: FrontCameraRecord
    base_airsim_port: 42051
    startup_timeout: 120.0
    episode_startup_settle_sec: 0.0
    render_warmup_sec: 25.0
    teleport_render_sync_frames: 3
    ignore_collision: false
    reset_ignore_collision: true
    capture_action_observations: true
    action_execution_mode: teleport_each_waypoint
    execute_waypoints_per_step: 8
    action_waypoint_semantics: anchor_relative_frd_xyz_yaw
    airsim_z_sign: 1.0
    ue_args:
    - -RenderOffscreen
    - -NoSound
    - -NoVSync
parallel:
  gpu_ids:
  - 0
  worker_timeout_sec: 0
output:
  root: ../../local/eval_results/traveluav
  run_name: qwen35_traveluav_portable
  save_step_artifacts: true
  save_images: true
  image_cameras:
  - frontcamera
  - downcamera
  metrics:
  - SR
  - OSR
  - NE
  - SPL
observation:
  fps: 0.2
driver_paths_file: ../driver_paths.yaml
