benchmark:
  name: aerialvln
  class_path: NavVLAeval.aerialvln.benchmark:AerialVLNBenchmark
  max_steps: 300
  max_samples: null
  kwargs:
    success_radius: 20.0
    termination_mode: action_or_max_steps
    stop_action_measure: final_segment_xyz_norm
    stop_action_confirmations: 2
    stop_action_threshold: 0.292
    ndtw_success_distance: 20.0
input:
  type: aerialvln_json
  adapter_class_path: NavVLAeval.aerialvln.inputs:AerialVLNJsonInputAdapter
  roots:
  - namespace: aerialvln_s_val_seen
    path: ../../local/data/AerialVLN/aerialvln_json/val_s_seen.json
  scene_ids:
  - 2
  - 3
  - 5
  - 8
  - 10
  - 12
  - 14
  - 17
model:
  uri: ws://127.0.0.1:10093
  statistics_key: vln_train_enhanced_lerobot_merged_remaining_20260813_vln_train
  seed: 42
  request_timeout_sec: 120.0
env:
  type: airsim
  backend_class_path: NavVLAeval.common.simulators.airsim.backend:AirSimEnvironmentBackend
  planner_class_path: NavVLAeval.common.simulators.airsim.backend:AirSimBackendPlanner
  kwargs:
    env_root: ../../local/data/AerialVLN/AerialVLN_env
    layout: aerialvln
    settings_profile: aerialvln
    sensor_profile: aerialvln
    camera_name: front_0
    base_airsim_port: 42451
    startup_timeout: 120.0
    episode_startup_settle_sec: 0.0
    render_warmup_sec: 25.0
    teleport_render_sync_frames: 3
    ignore_collision: true
    reset_ignore_collision: true
    capture_action_observations: true
    action_execution_mode: teleport_each_waypoint
    execute_waypoints_per_step: 8
    action_waypoint_semantics: anchor_relative_body_frame_xyz_yaw
    airsim_z_sign: 1.0
    ue_args:
    - -RenderOffscreen
    - -NoSound
    - -NoVSync
parallel:
  gpu_ids:
  - 0
  worker_timeout_sec: 0
output:
  root: ../../local/eval_results/aerialvln
  run_name: qwe35aerialvln_s_tb1024_ph32_full_seen_bats_qwen35wrapper_stride5_actionobs_8wp_sync3_learned_token_stop_finalseg0p292_k2_n300_20260819
  save_step_artifacts: true
  save_images: false
  action_observation_image_policy: step
  image_cameras:
  - image
  metrics:
  - SR
  - OSR
  - NE
  - SPL
  - nDTW
  - path_length
  - gt_path_length
  - steps_taken
observation:
  fps: 1.0
driver_paths_file: ../driver_paths.yaml
