benchmark:
  name: openfly
  class_path: NavVLAeval.openfly.benchmark:OpenFlyBenchmarkSpec
  max_steps: 80
  kwargs:
    success_radius: 20.0
    termination_mode: action_or_max_steps
    stop_action_measure: tail4_max_segment_xyz_norm
    stop_action_confirmations: 3
    stop_action_threshold: 0.31

input:
  type: starvla_episode_json
  adapter_class_path: NavVLAeval.openfly.inputs:OpenFlyStarVLAInputAdapter
  namespace: seen
  data_root: ../../local/data/OpenFly/openfly_env
  split: seen
  scene_ids:
    - env_airsim_16
    - env_airsim_18
    - env_airsim_23
    - env_airsim_26
    - env_airsim_gz
    - env_airsim_sh
  source_z_sign: -1

model:
  model_class_path: NavVLAeval.common.model.model_wrappers:StarVLAEvalModel
  framework_name: navvla_qwen35_cpm
  repo_root: ../..
  checkpoint: ../../local/checkpoints/openfly/final_model/pytorch_model.pt
  unnorm_key: vln_train_enhanced_lerobot_vln_train
  inference_seed: 42
  config_overrides:
    framework:
      qwenvl:
        base_vlm: ../../local/models/Qwen3.5-4B
      navvla:
        tvi_mode: learned_token

dataset:
  runtime_adapter: openfly
  dataset_py: airsim_openfly_datasets
  action_type: anchor_relative_body_frame_xyz_yaw
  action_dim: 4
  state_dim: 0
  action_horizon: 8
  history_selection: bats
  history_image_frames: null
  history_update_mode: action_observations
  history_candidate_source_stride: 5
  bats_epsilon: 0.1
  bats_k: 4.0
  use_dynamic_bats_k: true
  bats_sampling_mode: priority_capped
  bats_seed: 42
  bats_token_budget: 1024
  budget_num_cameras: 1
  current_visual_tokens: 64
  history_visual_tokens: 4
  tvi_tokens: 1

env:
  type: airsim
  backend_class_path: NavVLAeval.common.simulators.airsim.backend:AirSimEnvironmentBackend
  planner_class_path: NavVLAeval.common.simulators.airsim.backend:AirSimBackendPlanner
  kwargs:
    env_root: ../../local/data/OpenFly/openfly_env
    layout: openfly
    render_lib_root: ../../local/simulators/airsim_runtime
    settings_profile: openfly
    sensor_profile: openfly
    camera_name: front_custom
    base_airsim_port: 41451
    startup_timeout: 120.0
    episode_startup_settle_sec: 0.0
    render_warmup_sec: 25.0
    teleport_render_sync_frames: 3
    ignore_collision: true
    reset_ignore_collision: true
    capture_action_observations: true
    action_execution_mode: teleport_each_waypoint
    execute_waypoints_per_step: 8
    action_waypoint_semantics: anchor_relative_body_frame_xyz_yaw
    airsim_z_sign: 1.0
    ue_args: [-RenderOffscreen, -NoSound, -NoVSync]

parallel:
  gpu_ids: [0]
  partition_mode: contiguous_episode_chunks
  worker_timeout_sec: 0

output:
  root: ../../local/eval_results/openfly
  run_name: qwen35_openfly_portable
  save_step_artifacts: true
  save_images: false
  action_observation_image_policy: step
  image_cameras: [image]
  metrics: [SR, OSR, NE, SPL, standard_SPL]
