benchmark:
  name: openfly
  class_path: NavVLAeval.openfly.benchmark:OpenFlyBenchmark
  max_steps: 150
  max_samples: null
  kwargs:
    success_radius: 20.0
    stop_action_threshold: -1
input:
  type: starvla_episode_json
  adapter_class_path: NavVLAeval.openfly.inputs:OpenFlyStarVLAInputAdapter
  namespace: seen
  data_root: /path/to/openfly_env
  split: seen
  scene_ids:
  - env_airsim_23
model:
  uri: ws://127.0.0.1:10093
  statistics_key: vln_train_vln_train
  seed: 42
  request_timeout_sec: 120.0
env:
  type: airsim
  backend_class_path: NavVLAeval.common.simulators.airsim.backend:AirSimEnvironmentBackend
  planner_class_path: NavVLAeval.common.simulators.airsim.backend:AirSimBackendPlanner
  kwargs:
    env_root: /path/to/openfly_env
    layout: openfly
    settings_profile: openfly
    sensor_profile: openfly
    camera_name: front_custom
    base_airsim_port: 41451
    startup_timeout: 120
    episode_startup_settle_sec: 0
    render_warmup_sec: 25
    teleport_render_sync_frames: 3
    ignore_collision: false
    reset_ignore_collision: false
    capture_action_observations: true
    action_execution_mode: teleport_each_waypoint
    execute_waypoints_per_step: 8
    action_waypoint_semantics: anchor_relative_body_frame_xyz_yaw
    airsim_z_sign: -1
    ue_args:
    - -RenderOffscreen
    - -NoSound
    - -NoVSync
parallel:
  gpu_ids:
  - 0
  - 2
  worker_timeout_sec: 0
output:
  root: /path/to/eval_result/openfly_parallel
  run_name: openfly_eval
  save_step_artifacts: true
  save_images: false
  action_observation_image_policy: step
  image_cameras:
  - image
  metrics:
  - SR
  - OSR
  - NE
  - SPL
  - path_length
  - gt_path_length
observation:
  fps: 1.0
driver_paths_file: ../driver_paths.yaml
